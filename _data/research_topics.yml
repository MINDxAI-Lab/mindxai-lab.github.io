transportation-automated-driving:
  kind: domain
  label: Transportation & Automated Driving
  summary: Understanding driver states and behavior to support adaptive automation, safer mixed traffic, and driver education.
  description: Understanding driver states and behavior to support adaptive automation, safer mixed traffic, and driver education.
human-ai-autonomy-robot-teaming:
  kind: interaction
  label: Human–AI/Autonomy/Robot Teaming
  summary: Understanding human collaboration with AI, autonomous systems, and robots to support performance, learning, and user control.
  description: Examining human interaction and coordination with AI assistants, autonomous systems, and robotic devices. We study human states, interfaces, and adaptive support to improve joint performance, learning, and user control.
smart-manufacturing:
  kind: domain
  label: Smart Manufacturing
  summary: Designing AI assistants and their integration with virtual manufacturing environments to support human interaction, decision-making, and learning.
  description: Designing AI assistants and their integration with immersive virtual manufacturing environments. Our current work focuses on AI-supported guidance, feedback, and safety awareness within manufacturing activities, with education and workforce development as application contexts.
education-workforce-development:
  kind: domain
  label: Education & Workforce Development
  summary: Advancing education, training, and workforce development through AI-supported learning and simulation across levels of expertise.
  description: Developing learning and training experiences through AI, virtual reality, and simulation. Our work spans STEM education, driver safety education, and skill development, with attention to learners at different levels of expertise and pathways into the workforce.
rehabilitation-robotics-assistive-technologies:
  kind: domain
  label: Rehabilitation Robotics & Assistive Technologies
  summary: Designing and evaluating intuitive prosthetic interfaces and training technologies that support human movement and rehabilitation.
  description: Designing and evaluating intuitive prosthetic interfaces and training technologies that support human movement and rehabilitation.
healthcare-biomedical-ai:
  kind: domain
  label: Healthcare & Biomedical AI
  summary: Applying AI and human-centered research to biomedical signal modeling, neurological assessment, and patient-provider communication.
  description: Applying AI and human-centered research to biomedical signal modeling, neurological assessment, and patient-provider communication.
