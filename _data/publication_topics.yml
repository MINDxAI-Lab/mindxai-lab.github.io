# Keys match the stable publication IDs in Publications.md.
# Labels and their order come exclusively from research_topics.yml.
# Tags describe the paper's subject or direct methodological contribution,
# not every possible application of its parent project.
# Empty topics keep broader work in All without implying a domain study.
