{%- assign project = site.data.research_projects[include.project] -%}
<div class="research-project-tags" aria-label="Project application domains">
  {%- for topic_key in project.topics -%}
    {%- assign topic = site.data.research_topics[topic_key] -%}
    {%- if topic.kind == 'domain' -%}
  <a class="research-project-tag" href="#{{ topic_key }}" data-research-topic-link="{{ topic_key }}" aria-label="View projects in application domain: {{ topic.label | escape }}">{{ topic.label | escape }}</a>
    {%- endif -%}
  {%- endfor -%}
</div>
